<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Message Vault: fast access to reusable messages." />
  <title>Message Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-top">
        <div class="brand-mark" aria-hidden="true"></div>
        <button id="reloadBtn" class="refresh-btn" type="button" title="Refresh messages" aria-label="Refresh messages">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.4 6.4M20 4v7h-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Refresh</span>
        </button>
      </div>

      <div class="hero-branding">
        <div class="logo-wrap">
          <span class="logo-oval" aria-hidden="true"></span>
          <h1 class="logo-text">MESSAGE<br><span>VAULT</span></h1>
          <span class="logo-bolt" aria-hidden="true"></span>
        </div>
        <p class="hero-tagline">Same messages. More momentum.</p>
      </div>
    </header>

    <section class="toolbar" aria-label="Message filters">
      <label class="search-wrap" for="searchInput">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search messages..." autocomplete="off" />
      </label>

      <div class="filters-block">
        <div class="filter-group">
          <div class="filter-heading">PROJECT</div>
          <div id="projectFilters" class="filters filters-project"></div>
        </div>

        <div id="categoryGroup" class="filter-group">
          <div class="filter-heading">CATEGORY</div>
          <div id="categoryFilters" class="filters"></div>
        </div>
      </div>
    </section>

    <section class="results-bar" aria-live="polite">
      <p id="status" class="status">Loading messages...</p>
    </section>

    <section id="messageGrid" class="message-grid" aria-live="polite"></section>

    <footer class="footer">GOOD MESSAGES CREATE OPPORTUNITIES.</footer>
  </main>

  <div id="modalBackdrop" class="backdrop hidden" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <p id="modalMeta" class="modal-meta"></p>
          <h2 id="modalTitle"></h2>
        </div>
        <button id="closeModalBtn" class="close-btn" type="button" aria-label="Close message">×</button>
      </div>
      <label class="full-message-label" for="messageText">FULL MESSAGE</label>
      <textarea id="messageText" readonly></textarea>
      <div class="modal-actions">
        <button id="copyBtn" class="copy-btn modal-copy-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>COPY MESSAGE</span>
        </button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite">Copied</div>
  <script src="app.js"></script>
</body>
</html>
